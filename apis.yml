name: B&L Information Systems
description: B&L Information Systems, LLC is a metalcasting-focused enterprise resource
  planning (ERP) software company founded more than 50 years ago and headquartered in
  Bridgman, Michigan. Its flagship product, Odyssey ERP, is a cloud-based ERP purpose-built
  for foundries, die casters, and investment casters, spanning manufacturing, sales,
  inventory, quality, finance, and data analytics. B&L pairs the software with implementation,
  consulting, data-conversion, training, and support services tailored to the metalcasting
  industry. The company is a portfolio company of Battery Ventures. As of this enrichment
  pass, B&L does not publish a public developer portal, REST API documentation, SDKs, or
  an OpenAPI definition, so this profile captures company identity and public web properties
  rather than an API surface.
